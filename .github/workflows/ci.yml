name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    # arm64 macOS runner; Metal may be unavailable in the VM, in which case
    # conftest.py switches MLX to its CPU backend and gpu-marked tests skip.
    # The GPU benchmark (bench/bench.py) runs on real hardware as the release
    # gate instead.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      # exercise the no-Metal code paths explicitly (auto dispatch + scipy
      # fallback for kernel-only capabilities), even if the runner has a GPU
      - run: MLX_SIGNAL_SIMULATE_NO_METAL=1 python -m pytest -q

  # the oldest dependency stack pyproject.toml claims to support
  test-floor:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "scipy==1.11.*" "numpy==1.24.*" "mlx==0.30.*" "pytest>=8"
      - run: pip install -e . --no-deps
      - run: python -m pytest -q
      - run: MLX_SIGNAL_SIMULATE_NO_METAL=1 python -m pytest -q
