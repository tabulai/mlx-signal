[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mlx-signal-processing"
dynamic = ["version"]
description = "Metal/MLX-accelerated signal processing for Apple Silicon, mirroring scipy.signal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bojan Tunguz" }]
keywords = ["mlx", "metal", "signal-processing", "apple-silicon", "dsp", "scipy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mlx>=0.30",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "hypothesis>=6"]
# cross-library benchmark competitors (bench/bench_cross.py)
bench = ["torch", "torchaudio", "librosa", "soxr", "jax"]

[project.urls]
Homepage = "https://github.com/tabulai/mlx-signal"
Documentation = "https://github.com/tabulai/mlx-signal#readme"
Issues = "https://github.com/tabulai/mlx-signal/issues"
Source = "https://github.com/tabulai/mlx-signal"

[tool.hatch.version]
path = "src/mlx_signal_processing/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_signal_processing"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E741: single-letter names like `l`/`I` are conventional in DSP code
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: test requires a Metal GPU (skipped on CPU-only runners)",
    "slow: long-running test",
]
